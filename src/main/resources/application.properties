# Ballot Buddy Configuration
server.port=8080

# Gemini API Configuration (Using Vertex AI SDK)
google.gemini.model=gemini-1.5-pro
google.gemini.location=us-central1

# GCP Configuration
gcp.project.id=${GCP_PROJECT_ID:ballot-buddy-494805}
gcp.firebase.project-id=${GCP_PROJECT_ID:ballot-buddy-494805}
gcp.storage.bucket=${GCP_STORAGE_BUCKET:ballot-buddy-494805-analytics}

# Google Cloud Monitoring (Stackdriver)
management.metrics.export.stackdriver.project-id=${GCP_PROJECT_ID:ballot-buddy-494805}
management.metrics.export.stackdriver.enabled=true
management.metrics.export.stackdriver.step=1m
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Logging
logging.level.com.ballotbuddy=DEBUG
logging.level.org.springframework.web=INFO
