version: '3.8'

services:
  ballot-buddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ballot-buddy
    ports:
      - "8080:8080"
    environment:
      # Gemini API Key - REPLACE WITH YOUR ACTUAL KEY or use .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY:-REPLACE_ME}
      
      # GCP Configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-ballot-buddy-494805}
      - GCP_STORAGE_BUCKET=${GCP_STORAGE_BUCKET:-ballot-buddy-494805-analytics}
      
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      
      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - ballot-buddy-network

networks:
  ballot-buddy-network:
    driver: bridge
